<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#10b981">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hazel Laundry">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hazel Laundry Records</title>
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --primary-light: #ecfdf5;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 16px;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: #334155;
        --primary: #10b981;
        --primary-dark: #059669;
        --primary-light: #064e3b;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }

    @media (min-width: 800px) {
      body { padding-bottom: 0; padding-left: 220px; }
    }

    /* Top Bar */
    #top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: var(--card); border-bottom: 1px solid var(--border); }
    #top b { font-size: 18px; font-weight: 700; color: var(--text); }
    #top button { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #top .pl { background: var(--primary); color: #fff; border: 0; }

    /* Navigation */
    nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card); border-top: 1px solid var(--border); z-index: 20; padding-bottom: env(safe-area-inset-bottom, 0px); }
    nav button { flex: 1; border: 0; background: none; color: var(--muted); padding: 10px 4px; font-size: 11px; cursor: pointer; text-align: center; }
    nav button b { display: block; font-size: 20px; margin-bottom: 2px; }
    nav .on { color: var(--primary); font-weight: 700; }

    @media (min-width: 800px) {
      #top { display: none; }
      nav { top: 0; right: auto; width: 220px; flex-direction: column; border-top: 0; border-right: 1px solid var(--border); padding: 24px 12px; }
      nav button { text-align: left; padding: 12px 16px; font-size: 15px; border-radius: 12px; margin-bottom: 4px; }
      nav button b { display: inline; margin-right: 12px; font-size: 18px; }
      nav .on { background: var(--primary-light); }
    }

    @media (max-width: 799px) { nav .x { display: none; } }

    /* Layout & Cards */
    main { padding: 20px 16px; max-width: 1000px; margin: auto; }
    h2 { font-size: 24px; font-weight: 800; margin: 10px 0 16px; color: var(--text); }
    h3 { font-size: 18px; font-weight: 700; margin: 16px 0 10px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
    .hero { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: 0; }
    .hero .k { color: rgba(255,255,255,0.8); }
    .hero .v { color: #fff; }

    .k { font-size: 13px; color: var(--muted); }
    .v { font-size: 26px; font-weight: 800; margin: 4px 0; }
    .bad { color: var(--danger); }
    .warn { color: var(--warning); }
    .ok { color: var(--primary); }

    /* Forms & Controls */
    input, select, textarea { font: inherit; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--text); width: 100%; margin: 6px 0; outline: none; transition: border 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    
    button.btn { font: inherit; font-weight: 600; padding: 12px 20px; border-radius: 12px; background: var(--primary); color: #fff; border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s; }
    button.btn:active { opacity: 0.8; }
    button.btn.s { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    button.btn.d { background: var(--danger); }

    .row { display: flex; gap: 8px; align-items: center; }
    .row > * { flex: 1; }
    .row .w { flex: 0 0 auto; }
    .pill { display: inline-block; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--primary-light); color: var(--primary); }

    /* Segmented Switcher */
    .seg { display: flex; border: 1px solid var(--border); border-radius: 14px; padding: 4px; background: var(--card); overflow-x: auto; margin: 12px 0; }
    .seg button { flex: 1; border: 0; background: none; color: var(--muted); padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .seg .on { background: var(--primary); color: #fff; }

    /* Modal & Toast */
    #m { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); z-index: 50; overflow-y: auto; padding: 16px; }
    #m .box { background: var(--card); max-width: 540px; margin: 20px auto; border-radius: 20px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 12px 24px; border-radius: 99px; font-weight: 600; font-size: 14px; z-index: 100; display: none; box-shadow: var(--shadow); }

    /* Auth Styling */
    .auth-wrapper { max-width: 400px; margin: 40px auto; padding: 32px 24px; background: var(--card); border-radius: 24px; border: 1px solid var(--border); text-align: center; box-shadow: var(--shadow); }
    .auth-hero-img { font-size: 48px; margin-bottom: 12px; display: inline-block; }

    table { width: 100%; border-collapse: collapse; margin: 8px 0; }
    td { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }

    .rc { font-family: monospace; font-size: 13px; background: #fff; color: #000; padding: 16px; border-radius: 8px; }
    .rc hr { border: 0; border-top: 1px dashed #ccc; margin: 8px 0; }

    @media print {
      body > *:not(#m) { display: none !important; }
      #m { position: static; background: none; padding: 0; }
      .noprint { display: none !important; }
      .box { box-shadow: none; margin: 0; width: 100%; max-width: 100%; }
    }
  </style>
</head>
<body>
  <header id="top"></header>
  <nav id="nav"></nav>
  <main id="main"></main>
  <div id="m"></div>
  <div id="toast"></div>

  <script>
    const K = 'laundry_manager_v1';

    const init = () => ({
      users: [],
      customers: [],
      orders: [],
      payments: [],
      expenses: [],
      services: [],
      log: [],
      seq: { o: 0, c: 0, p: 0 },
      st: {
        name: 'Hazel Laundry Records',
        phone: '',
        wa: '',
        addr: '',
        footer: 'Thank you for choosing us!',
        prefix: 'LM'
      }
    });

    let db;
    try { db = JSON.parse(localStorage.getItem(K)) || init(); } catch (e) { db = init(); }

    db.users = db.users || [];
    db.closes = db.closes || [];
    db.inv = db.inv || [];

    let me = null, DB = null, snap = {}, pend = new Set(), busy = false, again = false, lt;
    const COLS = ['users', 'customers', 'orders', 'payments', 'expenses', 'log', 'closes', 'inv'];

    function save() {
      let ok = true;
      try { localStorage.setItem(K, JSON.stringify(db)); } catch (e) { ok = !!DB; }
      if (!ok) { alert('Could not save on this device. Export a backup now.'); return false; }
      if (DB) sync();
      return true;
    }

    async function sync() {
      if (!DB) return;
      if (busy) { again = true; return; }
      busy = true;

      try {
        do {
          again = false;
          for (const c of COLS) {
            for (const r of db[c]) {
              if (!r || !r.id) continue;
              const k = c + '/' + r.id;
              const s = JSON.stringify(r);
              if (snap[k] !== s) {
                snap[k] = s;
                pend.add(k);
                try { await DB.doc('lm_' + c + '/' + r.id).set(JSON.parse(s)); } finally { pend.delete(k); }
              }
            }
          }

          const g = { services: db.services, st: db.st, seq: db.seq };
          const s = JSON.stringify(g);
          if (snap.cfg !== s) {
            snap.cfg = s;
            pend.add('cfg');
            try { await DB.doc('lm_cfg/main').set(g); } finally { pend.delete('cfg'); }
          }
        } while (again);
      } catch (e) {
        snap = {};
        toast(e && e.code == 'invalid_argument' ? 'View-only access: changes not shared' : 'Could not sync. Check connection.');
      }
      busy = false;
    }

    function live() {
      clearTimeout(lt);
      lt = setTimeout(() => {
        if (!me || $('#m').style.display == 'block') return;
        const a = document.activeElement;
        if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
        const y = scrollY;
        go(cur);
        scrollTo(0, y);
      }, 500);
    }

    async function initCloud() {
      try {
        const C = window.FIREBASE_CONFIG;
        if (window.firebase && C && C.apiKey && C.apiKey.indexOf('PASTE') < 0) {
          firebase.initializeApp(C);
          const au = firebase.auth();
          const u = await new Promise(r => { const x = au.onAuthStateChanged(v => { x(); r(v); }); });
          if (!u) await deviceLogin(au);
          const fs = firebase.firestore();
          try { await fs.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
          DB = fs;
        }
      } catch (e) { DB = null; }

      if (!DB) return;

      const W = [];
      COLS.forEach(c => W.push(new Promise(res => {
        let f = 1;
        DB.collection('lm_' + c).onSnapshot(s => {
          s.docs.forEach(d => {
            const k = c + '/' + d.id;
            if (pend.has(k)) return;
            const v = JSON.parse(JSON.stringify(d.data()));
            const t = JSON.stringify(v);
            const a = db[c];
            const i = a.findIndex(x => x.id == d.id);
            snap[k] = t;
            if (i < 0) a.push(v);
            else if (JSON.stringify(a[i]) !== t) a[i] = v;
          });
          if (f) { f = 0; res(); } else live();
        }, e => { if (f) { f = 0; res(); } });
      })));

      W.push(new Promise(res => {
        let f = 1;
        DB.doc('lm_cfg/main').onSnapshot(s => {
          if (s.exists && !pend.has('cfg')) {
            const g = JSON.parse(JSON.stringify(s.data()));
            snap.cfg = JSON.stringify(g);
            if (g.services && g.services.length) db.services = g.services;
            db.st = Object.assign(db.st, g.st || {});
            ['o', 'c', 'p'].forEach(k => db.seq[k] = Math.max(db.seq[k] || 0, (g.seq || {})[k] || 0));
          }
          if (f) { f = 0; res(); } else live();
        }, e => { if (f) { f = 0; res(); } });
      }));

      await Promise.race([Promise.all(W), new Promise(r => setTimeout(r, 8000))]);
      sync();
    }

    async function start() {
      $('#main').innerHTML = '<p class=k style="text-align:center;margin-top:40px">Loading your records…</p>';
      await initCloud();
      boot();
      if (!DB) toast('Offline mode: records stay on this phone only');
    }

    const $ = s => document.querySelector(s);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const N = x => '₦' + Math.round(x || 0).toLocaleString('en-NG');
    const day = d => new Date(d).toLocaleDateString('sv-SE', { timeZone: 'Africa/Lagos' });
    const dmy = d => d ? new Date(d.length == 10 ? d + 'T12:00:00' : d).toLocaleDateString('en-GB', { timeZone: 'Africa/Lagos' }) : '';
    const dt = d => new Date(d).toLocaleString('en-GB', { timeZone: 'Africa/Lagos', hour12: false }).slice(0, 17);
    const today = () => day(new Date());
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

    const ST = ['Received', 'Washing', 'Drying', 'Ironing', 'Ready', 'Delivered', 'Cancelled'];
    const cust = id => db.customers.find(c => c.id == id) || { name: '(unknown)', phone: '', id: '?' };
    const tot = o => Math.max(0, o.items.reduce((a, i) => a + i.q * i.p, 0) + (+o.extra || 0) - (+o.disc || 0));
    const paid = o => db.payments.filter(p => p.oid == o.id && !p.void).reduce((a, p) => a + p.amt, 0);
    const bal = o => o.status == 'Cancelled' ? 0 : Math.max(0, tot(o) - paid(o));
    const late = o => !['Delivered', 'Cancelled'].includes(o.status) && o.due && o.due < today();

    function log(t) {
      db.log.unshift({ id: uid(), t: new Date().toISOString(), m: t, u: me ? me.name : '' });
      db.log = db.log.slice(0, 300);
    }

    function toast(m) {
      const t = $('#toast');
      t.textContent = m;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 2200);
    }

    function modal(h) {
      const m = $('#m');
      m.innerHTML = '<div class="box">' + h + '</div>';
      m.style.display = 'block';
      m.scrollTop = 0;
    }

    function closeM() { $('#m').style.display = 'none'; }

    const NAV = [
      ['dash', '🏠', 'Home'],
      ['ord', '🧺', 'Orders'],
      ['cus', '👥', 'Customers'],
      ['debt', '💰', 'Debts'],
      ['pay', '💳', 'Payments'],
      ['exp', '🧾', 'Expenses'],
      ['close', '🧮', 'Day close'],
      ['inv', '📦', 'Inventory'],
      ['act', '🕘', 'Activity'],
      ['set', '⚙️', 'Settings']
    ];

    let cur = 'dash';
    let per = { k: 'today', f: today(), t: today() };
    let of = { q: '', s: '' };
    let cq = '';

    function go(v) {
      if (!me) return authScreen();
      const adm = me.role == 'admin';
      if (!adm && !['ord', 'cus', 'debt'].includes(v)) v = 'ord';
      cur = v;

      $('#nav').innerHTML = NAV.filter(n => adm || ['ord', 'cus', 'debt'].includes(n[0]))
        .map(n => `<button class="${n[0] == v ? 'on' : ''} ${!['dash', 'ord', 'cus', 'debt'].includes(n[0]) ? 'x' : ''}" onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`)
        .join('');

      $('#nav').insertAdjacentHTML('beforeend', '<button class=x onclick="logout()"><b>🔒</b>Log out</button>');
      $('#top').innerHTML = '<button onclick="menu()">☰</button><b>💧 Hazel Laundry</b><button class=pl onclick="orderForm()">+</button>';
      $('#main').innerHTML = ({ dash, ord, cus, debt, exp, set, pay, close: dclose, inv, act })[v]();

      if (v == 'ord') drawO();
      if (v == 'cus') drawC();
      scrollTo(0, 0);
    }

    function range() {
      const t = today();
      if (per.k == 'today') return [t, t];
      if (per.k == 'week') return [day(Date.now() - 6 * 864e5), t];
      if (per.k == 'month') return [t.slice(0, 8) + '01', t];
      if (per.k == 'all') return ['0000', '9999'];
      return [per.f || '0000', per.t || '9999'];
    }

    const inR = (iso, r) => {
      const d = iso.length == 10 ? iso : day(iso);
      return d >= r[0] && d <= r[1];
    };

    function setPer(k) { per.k = k; go('dash'); }

    /* AUTH & WELCOME SCREENS */
    function authScreen() {
      $('#nav').innerHTML = '';
      $('#top').innerHTML = '';
      const hasUsers = db.users.some(u => u.active !== false);

      if (!hasUsers) renderWelcomeScreen();
      else renderLoginForm();
    }

    function renderWelcomeScreen() {
      $('#main').innerHTML = `<div class=auth-wrapper>
        <div class=auth-hero-img>💧</div>
        <h2>${esc(db.st.name)}</h2>
        <p class=k style="margin-bottom: 20px;">Professional Laundry Workflow & Business Records</p>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <button class=btn style="width:100%;" onclick="renderSignUpForm()">Get Started (Sign Up)</button>
          <button class="btn s" style="width:100%;" onclick="renderLoginForm()">Log In Existing Account</button>
        </div>
      </div>`;
    }

    function renderSignUpForm() {
      $('#main').innerHTML = `<div class=auth-wrapper>
        <div class=auth-hero-img>📝</div>
        <h2>Create Account</h2>
        <p class=k style="margin-bottom:16px;">Set up your profile to manage laundry orders</p>

        <input id=an placeholder="Full Name">
        <input id=ap type=tel placeholder="Phone Number">
        <select id=ar>
          <option value="admin">Administrator (Full Access)</option>
          <option value="staff">Staff Member (Limited Access)</option>
        </select>
        <input id=ak type=password inputmode=numeric placeholder="Create PIN (4-8 digits)">
        <input id=ak2 type=password inputmode=numeric placeholder="Confirm PIN">

        <button class=btn style="width:100%; margin-top:12px;" onclick="regAdmin()">Complete Sign Up</button>
        <button class="btn s" style="width:100%; margin-top:6px;" onclick="renderWelcomeScreen()">Back</button>
      </div>`;
    }

    function renderLoginForm() {
      const hasUsers = db.users.some(u => u.active !== false);

      $('#main').innerHTML = `<div class=auth-wrapper>
        <div class=auth-hero-img>👔</div>
        <h2>Welcome Back</h2>
        <p class=k style="margin-bottom:16px;">Sign in to access laundry records</p>

        ${hasUsers ? `
          <label class=k style="text-align:left; display:block;">Select Account</label>
          <select id=lu>
            ${db.users.filter(u => u.active !== false).map(u => '<option value="' + u.id + '">' + esc(u.name) + ' (' + u.role + ')</option>').join('')}
          </select>
          <input id=lp type=password inputmode=numeric placeholder="Enter PIN" onkeydown="if(event.key==='Enter')login()">
          <button class=btn style="width:100%; margin-top:12px;" onclick="login()">Log In</button>
        ` : `
          <p class=bad style="margin-bottom:12px;">No registered accounts found on this device.</p>
          <button class=btn style="width:100%;" onclick="renderSignUpForm()">Go to Sign Up</button>
        `}

        <button class="btn s" style="width:100%; margin-top:6px;" onclick="renderWelcomeScreen()">Back</button>
      </div>`;
    }

    async function H(p, s) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s + p));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    const okPin = p => /^\d{4,8}$/.test(p);
    let bad = 0, lock = 0;

    function sess(id) {
      try { id ? sessionStorage.setItem('lm_u', id) : sessionStorage.removeItem('lm_u'); } catch (e) {}
    }

    async function regAdmin() {
      const n = $('#an').value.trim();
      const p = $('#ap').value.trim();
      const role = $('#ar').value;
      const k = $('#ak').value;

      if (!n || !p) return alert('Please enter full name and phone number.');
      if (!okPin(k)) return alert('PIN must be 4 to 8 digits.');
      if (k !== $('#ak2').value) return alert('PIN confirmation does not match.');

      const s = uid();
      const u = {
        id: 'U' + uid(),
        name: n,
        phone: p,
        role: role,
        salt: s,
        hash: await H(k, s),
        active: true,
        at: new Date().toISOString()
      };

      db.users.push(u);
      me = u;
      log('User registered: ' + n + ' (' + role + ')');

      if (save()) {
        sess(u.id);
        toast('Account created successfully!');
        go(u.role == 'admin' ? 'dash' : 'ord');
      }
    }

    async function login() {
      const selectElem = $('#lu');
      if (!selectElem) return renderSignUpForm();

      const userId = selectElem.value;
      const u = db.users.find(x => x.id == userId);
      if (!u) return renderSignUpForm();

      if (Date.now() < lock) return alert('Too many attempts. Wait ' + Math.ceil((lock - Date.now()) / 1000) + 's.');

      const enteredPin = $('#lp').value;
      if (await H(enteredPin, u.salt) == u.hash) {
        bad = 0;
        me = u;
        sess(u.id);
        log('Logged in: ' + u.name);
        go(u.role == 'admin' ? 'dash' : 'ord');
      } else {
        if (++bad >= 5) { lock = Date.now() + 30000; bad = 0; }
        alert('Incorrect PIN. Please try again.');
        $('#lp').value = '';
      }
    }

    function logout() { me = null; sess(null); authScreen(); }

    function deviceLogin(au) {
      return new Promise(res => {
        $('#nav').innerHTML = '';
        $('#top').innerHTML = '';
        $('#main').innerHTML = `<div class=auth-wrapper>
          <div class=auth-hero-img>🔐</div>
          <h2>Cloud Auth</h2>
          <p class=k style="margin-bottom:16px">Owner Firebase Sync Access</p>
          <input id=de type=email placeholder="Email address">
          <input id=dp type=password placeholder="Password">
          <button class=btn id=dlb style="width:100%; margin-top:10px;">Sign in</button>
          <p id=dm class=bad style="margin-top:10px; font-size:13px;"></p>
        </div>`;

        $('#dlb').onclick = async () => {
          try {
            await au.signInWithEmailAndPassword($('#de').value.trim(), $('#dp').value);
            res();
          } catch (e) { $('#dm').textContent = 'Sign-in failed. Check credentials.'; }
        };
      });
    }

    /* APP MODULES & VIEWS */
    function ord() {
      return `<h2>Orders</h2>
      <button class=btn onclick="orderForm()">+ New order</button>
      <div class=row style="margin: 12px 0;">
        <input placeholder="Search name, phone or receipt no" oninput="of.q=this.value;drawO()" value="${esc(of.q)}">
        <select class=w onchange="of.s=this.value;drawO()">
          <option value="">All Statuses</option>
          ${ST.map(s => `<option ${of.s == s ? 'selected' : ''}>${s}</option>`).join('')}
          <option value="OD" ${of.s == 'OD' ? 'selected' : ''}>Overdue</option>
        </select>
      </div>
      <div id=list></div>`;
    }

    function drawO() {
      const q = of.q.toLowerCase();
      const L = db.orders.filter(o => {
        const c = cust(o.cid);
        return (!q || (o.no + c.name + c.phone).toLowerCase().includes(q)) && (!of.s || (of.s == 'OD' ? late(o) : o.status == of.s));
      }).sort((a, b) => b.at < a.at ? -1 : 1);

      $('#list').innerHTML = L.map(o => {
        const c = cust(o.cid);
        return `<div class=card onclick="orderView('${o.id}')">
          <div class=row>
            <b>${esc(o.no)} · ${esc(c.name)}</b>
            <span class="pill w">${o.status}</span>
          </div>
          <div class=k style="margin: 6px 0;">
            ${dmy(o.at)} · Due: ${dmy(o.due) || '-'} ${late(o) ? '<b class=bad>OVERDUE</b>' : ''}
          </div>
          <div>
            ${N(tot(o))} · Paid: ${N(paid(o))} · <b class="${bal(o) ? 'bad' : 'ok'}">Owes: ${N(bal(o))}</b>
          </div>
        </div>`;
      }).join('') || '<p class=k>No orders found.</p>';
    }

    function orderForm() {
      const cs = db.customers.filter(c => c.active !== false);
      modal(`<h3>New Laundry Order</h3>
      <select id=oc>
        <option value="">New customer…</option>
        ${cs.map(c => `<option value="${c.id}">${esc(c.name)} · ${esc(c.phone)}</option>`).join('')}
      </select>
      <div class=row>
        <input id=nn placeholder="New Customer Name">
        <input id=np placeholder="Phone" type=tel>
      </div>
      <div id=rows style="margin-top:10px;"></div>
      <button class="btn s" onclick="addRow()" style="width:100%; margin-bottom:12px;">+ Add Item</button>
      ${me.role == 'admin' ? `
        <div class=row>
          <div>Discount ₦<input id=od type=number min=0 value=0></div>
          <div>Extra Charge ₦<input id=oe type=number min=0 value=0></div>
        </div>
      ` : '<input id=od type=hidden value=0><input id=oe type=hidden value=0>'}
      <div class=row>
        <div>Paid Now ₦<input id=op type=number min=0 value=0></div>
        <div>Method
          <select id=om>
            <option>Cash</option>
            <option>Bank transfer</option>
            <option>POS</option>
            <option>Other</option>
          </select>
        </div>
      </div>
      <div class=row>
        <div>Expected Ready Date<input id=odue type=date value="${day(Date.now() + 2 * 864e5)}"></div>
      </div>
      <textarea id=ono placeholder="Special Instructions / Stain Notes"></textarea>
      <button class=btn id=sv onclick="saveOrder()" style="width:100%; margin-top:10px;">Save Order</button>
      <button class="btn s" onclick="closeM()" style="width:100%; margin-top:6px;">Cancel</button>`);

      addRow();
    }

    function addRow() {
      const adm = me.role == 'admin';
      const d = document.createElement('div');
      d.className = 'row';
      d.style.marginBottom = '6px';
      d.innerHTML = `
        <select class=sl onchange="pickSel(this)" style="flex:2">
          <option value="">${db.services.length ? 'Choose Service…' : 'No items added'}</option>
          ${db.services.map((s, i) => `<option value="${i}">${esc(s.n)} · ${N(s.p)}</option>`).join('')}
          ${adm ? '<option value="c">Custom item…</option>' : ''}
        </select>
        <input class=nm placeholder="Item Name" style="display:none; flex:2;">
        <input class=qt type=number min=1 value=1 style="flex:1;">
        <input class=pr type=number min=0 placeholder="Price" style="flex:1;" ${adm ? '' : 'readonly'}>
      `;
      $('#rows').appendChild(d);
    }

    function pickSel(el) {
      const r = el.parentNode;
      const nm = r.querySelector('.nm');
      const pr = r.querySelector('.pr');

      if (el.value === 'c') {
        nm.style.display = 'block';
        nm.value = '';
        pr.value = '';
        return;
      }
      nm.style.display = 'none';
      const s = db.services[+el.value];
      if (s && el.value !== '') {
        nm.value = s.n;
        pr.value = s.p;
      } else {
        nm.value = '';
        pr.value = '';
      }
    }

    function saveOrder() {
      const items = [...document.querySelectorAll('#rows .row')].map(r => ({
        n: r.querySelector('.nm').value.trim(),
        q: +r.querySelector('.qt').value,
        p: +r.querySelector('.pr').value
      })).filter(i => i.n || i.q || i.p);

      if (me.role != 'admin') {
        if (items.some(i => {
          const s = db.services.find(s => s.n == i.n);
          return !s || !(s.p > 0);
        })) return alert('Staff can only select items from the preset price list.');
        items.forEach(i => i.p = db.services.find(s => s.n == i.n).p);
      }

      if (!items.length || items.some(i => !i.n || !(i.q > 0) || !(i.p >= 0))) return alert('Items need a valid name, quantity and price.');

      let cid = $('#oc').value;
      if (!cid) {
        const n = $('#nn').value.trim();
        const p = $('#np').value.trim();
        if (!n || !p) return alert('Select or enter customer details.');
        const ex = db.customers.find(c => c.phone == p);
        cid = ex && confirm('Customer with this phone exists. Use existing profile?') ? ex.id : newCust(n, p, '', '');
      }

      const disc = +$('#od').value || 0;
      const extra = +$('#oe').value || 0;
      const pay = +$('#op').value || 0;

      const o = {
        id: uid(),
        no: '',
        cid,
        items,
        disc,
        extra,
        status: 'Received',
        hist: [{ s: 'Received', t: new Date().toISOString() }],
        at: new Date().toISOString(),
        due: $('#odue').value,
        notes: $('#ono').value.trim()
      };

      const T = tot(o);
      if (pay < 0 || pay > T) return alert('Payment cannot exceed total (' + N(T) + ').');

      o.no = db.st.prefix + '-' + String(db.seq.o = Math.max(db.seq.o, db.orders.length) + 1).padStart(4, '0');
      db.orders.push(o);
      log('Order ' + o.no + ' created');

      if (pay > 0) {
        db.payments.push({
          id: 'P' + uid().slice(-6).toUpperCase(),
          oid: o.id,
          cid,
          amt: pay,
          m: $('#om').value,
          ref: 'Paid at drop-off',
          at: new Date().toISOString(),
          void: false
        });
      }

      if (save()) {
        toast('Order saved');
        closeM();
        go('ord');
        orderView(o.id);
      }
    }

    function newCust(n, p, a, no) {
      const c = { id: 'C' + uid().slice(-6).toUpperCase(), name: n, phone: p, addr: a, notes: no, at: new Date().toISOString(), active: true };
      db.customers.push(c);
      log('Customer ' + n + ' added');
      return c.id;
    }

    function orderView(id) {
      const o = db.orders.find(x => x.id == id);
      const c = cust(o.cid);
      const ps = db.payments.filter(p => p.oid == id);

      modal(`<div class=row>
        <h3>${esc(o.no)}</h3>
        <span class="pill w">${o.status}</span>
      </div>
      <p style="margin-bottom:12px;"><b>${esc(c.name)}</b> (${esc(c.phone)})<br>
        <span class=k>Received: ${dt(o.at)} · Due: ${dmy(o.due) || '-'}</span>
      </p>
      <table>
        ${o.items.map(i => `<tr><td>${i.q} × ${esc(i.n)}</td><td align=right>${N(i.q * i.p)}</td></tr>`).join('')}
        ${o.extra ? `<tr><td>Extra</td><td align=right>${N(o.extra)}</td></tr>` : ''}
        ${o.disc ? `<tr><td>Discount</td><td align=right>-${N(o.disc)}</td></tr>` : ''}
        <tr><td><b>Total</b></td><td align=right><b>${N(tot(o))}</b></td></tr>
        <tr><td>Paid</td><td align=right>${N(paid(o))}</td></tr>
        <tr><td><b>Balance Owed</b></td><td align=right class="${bal(o) ? 'bad' : 'ok'}"><b>${N(bal(o))}</b></td></tr>
      </table>
      ${o.notes ? `<p class=k style="margin:8px 0;">Note: ${esc(o.notes)}</p>` : ''}
      
      <h3>Status Update</h3>
      ${o.status != 'Cancelled' ? `
        <select onchange="setStatus('${id}',this.value)">
          ${ST.filter(s => s != 'Cancelled').map(s => `<option ${o.status == s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      ` : '<p class=k>Order cancelled.</p>'}

      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:14px;">
        <button class=btn onclick="receipt('${id}')">Receipt</button>
        <button class="btn s" onclick="wa('${id}','recv')">WhatsApp</button>
        ${o.status != 'Cancelled' && me.role == 'admin' ? `
          <button class="btn s" onclick="editOrder('${id}')">Edit</button>
          <button class="btn d" onclick="cancelO('${id}')">Cancel</button>
        ` : ''}
        <button class="btn s" onclick="closeM();go('${cur}')">Close</button>
      </div>`);
    }

    function setStatus(id, s) {
      const o = db.orders.find(x => x.id == id);
      if (s == 'Delivered' && bal(o) > 0 && !confirm('Customer still owes ' + N(bal(o)) + '. Mark delivered anyway?')) return orderView(id);
      o.status = s;
      o.hist.push({ s, t: new Date().toISOString() });
      if (s == 'Delivered') o.doneAt = new Date().toISOString();
      log(o.no + ' → ' + s);
      save();
      toast('Status updated');
      orderView(id);
    }

    function cancelO(id) {
      if (!confirm('Cancel this order?')) return;
      const o = db.orders.find(x => x.id == id);
      o.status = 'Cancelled';
      o.hist.push({ s: 'Cancelled', t: new Date().toISOString() });
      log(o.no + ' cancelled');
      save();
      orderView(id);
    }

    function receipt(id) {
      const o = db.orders.find(x => x.id == id);
      const c = cust(o.cid);
      const s = db.st;
      const ps = db.payments.filter(p => p.oid == id && !p.void);

      modal(`<div class="rc" id=rcpt>
        <div align=center>
          <b style="font-size:16px">${esc(s.name)}</b><br>
          ${esc(s.addr)}<br>
          ${esc(s.phone)}
        </div>
        <hr>
        Receipt: <b>${esc(o.no)}</b><br>
        Customer: ${esc(c.name)} (${esc(c.phone)})<br>
        Received: ${dt(o.at)}<br>
        Expected: ${dmy(o.due) || '-'}<br>
        Status: ${o.status}
        <hr>
        <table>
          ${o.items.map(i => `<tr><td>${i.q} × ${esc(i.n)} @ ${N(i.p)}</td><td align=right>${N(i.q * i.p)}</td></tr>`).join('')}
        </table>
        ${o.extra ? 'Extra: ' + N(o.extra) + '<br>' : ''}
        ${o.disc ? 'Discount: -' + N(o.disc) + '<br>' : ''}
        <hr>
        <b>TOTAL: ${N(tot(o))}</b><br>
        Paid: ${N(paid(o))}<br>
        <b>Balance: ${N(bal(o))}</b>
        <hr>
        <div align=center>${esc(s.footer)}</div>
      </div>
      <div class=noprint style="margin-top:12px; display:flex; gap:6px;">
        <button class=btn onclick="print()">Print / Save PDF</button>
        <button class="btn s" onclick="orderView('${id}')">Back</button>
      </div>`);
    }

    function msg(o, t) {
      const c = cust(o.cid);
      const n = db.st.name;
      const itemList = o.items.map(i => `${i.q}x ${i.n}`).join(', ');

      const m = {
        recv: `Hello ${c.name},\n\nYour laundry order (${o.no}) has been received.\n\nItems: ${itemList}\nTotal: ${N(tot(o))}\nPaid: ${N(paid(o))}\nBalance: ${N(bal(o))}\nExpected: ${dmy(o.due)}\n\nThank you for choosing ${n}!`,
        ready: `Hello ${c.name},\n\nYour laundry order (${o.no}) containing [ ${itemList} ] is ready for collection.\n\nOutstanding balance: ${N(bal(o))}.\n\nThank you, ${n}!`,
        paid: `Hello ${c.name},\n\nPayment received for order ${o.no}.\nTotal paid: ${N(paid(o))}\nBalance: ${N(bal(o))}\n\nThank you, ${n}!`,
        owe: `Hello ${c.name},\n\nReminder: outstanding balance of ${N(bal(o))} on order ${o.no}.\n\nThank you, ${n}!`,
        done: `Hello ${c.name},\n\nOrder ${o.no} is completed. Thank you for choosing ${n}!`
      };
      return m[t];
    }

    function wa(id, t) {
      const o = db.orders.find(x => x.id == id);
      const c = cust(o.cid);
      let p = (c.phone || '').replace(/\D/g, '');
      if (p.startsWith('0')) p = '234' + p.slice(1);
      if (!p) return alert('Customer has no phone number.');

      modal(`<h3>WhatsApp Notification</h3>
      <select id=wt onchange="$('#wm').value=msg(db.orders.find(x=>x.id=='${id}'),this.value)">
        <option value=recv>Order received</option>
        <option value=ready>Ready for collection</option>
        <option value=paid>Payment received</option>
        <option value=owe>Balance reminder</option>
        <option value=done>Order completed</option>
      </select>
      <textarea id=wm rows=6>${esc(msg(o, t))}</textarea>
      <a class=btn style="display:block; text-align:center; text-decoration:none; margin-top:10px;" target=_blank rel=noopener onclick="this.href='https://wa.me/${p}?text='+encodeURIComponent($('#wm').value)" href="#">Open WhatsApp</a>
      <button class="btn s" style="width:100%; margin-top:6px;" onclick="orderView('${id}')">Back</button>`);

      $('#wt').value = t;
    }

    function cus() {
      return `<h2>Customers</h2>
      <button class=btn onclick="custForm()">+ Add Customer</button>
      <input placeholder="Search name, phone or ID" oninput="cq=this.value;drawC()" value="${esc(cq)}" style="margin: 12px 0;">
      <div id=list></div>`;
    }

    function drawC() {
      const q = cq.toLowerCase();
      $('#list').innerHTML = db.customers.filter(c => !q || (c.name + c.phone + c.id).toLowerCase().includes(q)).map(c => {
        const os = db.orders.filter(o => o.cid == c.id && o.status != 'Cancelled');
        return `<div class=card>
          <b>${esc(c.name)}</b> <span class=k>${c.id}</span><br>
          ${esc(c.phone)} ${c.addr ? '· ' + esc(c.addr) : ''}<br>
          <span class=k>Orders: ${os.length} · Spent: ${N(os.reduce((a, o) => a + paid(o), 0))}</span> · 
          <b class="${os.reduce((a, o) => a + bal(o), 0) ? 'bad' : ''}">Owes: ${N(os.reduce((a, o) => a + bal(o), 0))}</b>
          <div style="margin-top:10px; display:flex; gap:6px;">
            <button class="btn s" onclick="custForm('${c.id}')">Edit</button>
            <button class="btn s" onclick="custHist('${c.id}')">History</button>
          </div>
        </div>`;
      }).join('') || '<p class=k>No customers found.</p>';
    }

    function custForm(id) {
      const c = db.customers.find(x => x.id == id) || {};
      modal(`<h3>${id ? 'Edit' : 'Add'} Customer</h3>
      <input id=cn placeholder="Full Name" value="${esc(c.name || '')}">
      <input id=cp type=tel placeholder="Phone Number" value="${esc(c.phone || '')}">
      <input id=ca placeholder="Address (optional)" value="${esc(c.addr || '')}">
      <textarea id=cno placeholder="Notes">${esc(c.notes || '')}</textarea>
      <button class=btn onclick="saveC('${id || ''}')" style="width:100%; margin-top:10px;">Save Customer</button>
      <button class="btn s" onclick="closeM()" style="width:100%; margin-top:6px;">Cancel</button>`);
    }

    function saveC(id) {
      const n = $('#cn').value.trim();
      const p = $('#cp').value.trim();
      if (!n || !p) return alert('Name and phone number are required.');

      if (id) {
        const c = db.customers.find(x => x.id == id);
        Object.assign(c, { name: n, phone: p, addr: $('#ca').value.trim(), notes: $('#cno').value.trim() });
      } else {
        newCust(n, p, $('#ca').value.trim(), $('#cno').value.trim());
      }

      if (save()) { toast('Saved'); closeM(); go('cus'); }
    }

    function custHist(id) {
      const c = cust(id);
      modal(`<h3>History: ${esc(c.name)}</h3>
      ${db.orders.filter(o => o.cid == id).map(o => `
        <div class=card onclick="orderView('${o.id}')">
          ${o.no} · ${dmy(o.at)} · ${o.status}<br>
          Total: ${N(tot(o))} · Owes: ${N(bal(o))}
        </div>
      `).join('') || '<p class=k>No orders registered.</p>'}
      <button class="btn s" onclick="closeM()" style="width:100%; margin-top:10px;">Close</button>`);
    }

    function debt() {
      const L = db.orders.filter(o => bal(o) > 0).sort((a, b) => bal(b) - bal(a));
      return `<h2>Outstanding Debts</h2>
      <div class=card>
        <div class=k>Total Uncollected Balance</div>
        <div class="v bad">${N(L.reduce((a, o) => a + bal(o), 0))}</div>
      </div>
      ` + (L.map(o => {
        const c = cust(o.cid);
        return `<div class=card>
          <b>${esc(c.name)}</b> · ${esc(c.phone)}<br>
          <span class=k>${o.no} · Total: ${N(tot(o))} · Paid: ${N(paid(o))}</span><br>
          <b class=bad>Owes: ${N(bal(o))}</b>
          <div style="margin-top:10px; display:flex; gap:6px;">
            <button class=btn onclick="orderView('${o.id}')">Record Payment</button>
            <button class="btn s" onclick="wa('${o.id}','owe')">Send Reminder</button>
          </div>
        </div>`;
      }).join('') || '<p class=k>No outstanding balances!</p>');
    }

    function exp() {
      const cats = [...new Set(['Detergents', 'Electricity & fuel', 'Water', 'Salaries', 'Repairs', 'Packaging', 'Transport', 'Rent', 'Other', ...db.expenses.map(e => e.cat)])];
      return `<h2>Expenses</h2>
      <div class=card>
        <h3>Record New Expense</h3>
        <datalist id=cl>${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
        <div class=row>
          <input id=ed type=date value="${today()}">
          <input id=ea type=number min=1 placeholder="Amount ₦">
        </div>
        <input id=ec list=cl placeholder="Category (or type new)">
        <input id=edc placeholder="Description">
        <div class=row>
          <select id=em>
            <option>Cash</option>
            <option>Bank transfer</option>
            <option>POS</option>
            <option>Other</option>
          </select>
          <input id=er placeholder="Ref # (optional)">
        </div>
        <button class=btn onclick="addExp()" style="width:100%; margin-top:10px;">Save Expense</button>
      </div>
      ${db.expenses.slice().sort((a, b) => b.date < a.date ? -1 : 1).map(e => `
        <div class=card style="${e.void ? 'opacity:.5;text-decoration:line-through' : ''}">
          <div class=row>
            <span>
              <b>${esc(e.cat)}</b> · ${esc(e.desc)}<br>
              <span class=k>${dmy(e.date)} · ${e.m} ${esc(e.ref)}</span>
            </span>
            <span class=w><b>${N(e.amt)}</b></span>
          </div>
        </div>
      `).join('')}`;
    }

    function addExp() {
      const a = +$('#ea').value;
      const c = $('#ec').value.trim();
      const d = $('#ed').value;
      if (!(a > 0) || !c || !d) return alert('Date, category and valid amount required.');

      db.expenses.push({ id: uid(), date: d, cat: c, desc: $('#edc').value.trim(), amt: a, m: $('#em').value, ref: $('#er').value.trim(), void: false });
      log('Expense ' + N(a) + ' ' + c);
      if (save()) { toast('Expense saved'); go('exp'); }
    }

    function dash() {
      const r = range();
      const live = db.orders.filter(o => o.status != 'Cancelled');
      const pO = live.filter(o => inR(o.at, r));
      const sales = pO.reduce((a, o) => a + tot(o), 0);
      const items = pO.reduce((a, o) => a + o.items.reduce((x, i) => x + i.q, 0), 0);
      const col = db.payments.filter(p => !p.void && inR(p.at, r)).reduce((a, p) => a + p.amt, 0);
      const exs = db.expenses.filter(e => !e.void && inR(e.date, r));
      const ex = exs.reduce((a, e) => a + e.amt, 0);
      const owed = live.reduce((a, o) => a + bal(o), 0);

      return `<h2>Dashboard Overview</h2>
      <div class=seg>
        ${[['today', 'Today'], ['week', 'This Week'], ['month', 'This Month'], ['all', 'All Time']].map(x => `<button class='${per.k == x[0] ? 'on' : ''}' onclick="setPer('${x[0]}')">${x[1]}</button>`).join('')}
      </div>

      <div class=grid>
        <div class='card hero'>
          <div class=k>SALES RECORDED</div>
          <div class=v>${N(sales)}</div>
          <div class=k>${pO.length} orders · ${items} items</div>
        </div>
        <div class=card>
          <div class=k>CASH COLLECTED</div>
          <div class=v>${N(col)}</div>
          <div class=k>Payments received</div>
        </div>
        <div class=card>
          <div class=k>OUTSTANDING</div>
          <div class="v bad">${N(owed)}</div>
          <div class=k>Owed across orders</div>
        </div>
        <div class=card>
          <div class=k>EXPENSES</div>
          <div class=v>${N(ex)}</div>
          <div class=k>${exs.length} entries</div>
        </div>
      </div>

      <div class=card>
        <div class=k>ESTIMATED PROFIT</div>
        <div class='v ${sales - ex < 0 ? 'bad' : 'ok'}'>${N(sales - ex)}</div>
        <div class=k>Sales – Expenses</div>
      </div>`;
    }

    function set() {
      const s = db.st;
      return `<h2>Settings</h2>
      <div class=card>
        <h3>Business Info</h3>
        ${[['name', 'Business Name'], ['phone', 'Phone'], ['wa', 'WhatsApp'], ['addr', 'Address'], ['footer', 'Receipt Footer'], ['prefix', 'Receipt Prefix']].map(f => `
          <label class=k>${f[1]}</label>
          <input id=s_${f[0]} value="${esc(s[f[0]])}">
        `).join('')}
        <button class=btn onclick="saveS()" style="width:100%; margin-top:10px;">Save Business Info</button>
      </div>

      <div class=card>
        <h3>Staff Accounts</h3>
        ${db.users.map(u => `
          <div class=row style="padding:6px 0;">
            <span>${esc(u.name)} <span class=k>(${u.role})</span></span>
            <button class="btn s" onclick="resetPin('${u.id}')">Reset PIN</button>
          </div>
        `).join('')}
      </div>`;
    }

    function saveS() {
      ['name', 'phone', 'wa', 'addr', 'footer', 'prefix'].forEach(k => db.st[k] = $('#s_' + k).value.trim());
      if (!db.st.name) db.st.name = 'Hazel Laundry';
      if (save()) toast('Settings saved');
    }

    async function resetPin(id) {
      const u = db.users.find(x => x.id == id);
      const k = prompt('Enter new PIN for ' + u.name + ' (4-8 digits):');
      if (k === null) return;
      if (!okPin(k)) return alert('PIN must be 4 to 8 digits.');

      u.salt = uid();
      u.hash = await H(k, u.salt);
      log('PIN reset for ' + u.name);
      save();
      toast('PIN updated successfully');
    }

    function pay() {
      const r = range();
      const L = db.payments.filter(p => inR(p.at, r)).sort((a, b) => b.at < a.at ? -1 : 1);
      return `<h2>Payments Received</h2>
      ` + (L.map(p => {
        const o = db.orders.find(x => x.id == p.oid) || {};
        return `<div class=card onclick="orderView('${p.oid}')">
          <div class=row>
            <span>
              <b>${esc(cust(p.cid).name)}</b> · ${esc(o.no || '')}<br>
              <span class=k>${dt(p.at)} · ${p.m} ${esc(p.ref || '')}</span>
            </span>
            <b class="w ok">${N(p.amt)}</b>
          </div>
        </div>`;
      }).join('') || '<p class=k>No payments recorded in this period.</p>');
    }

    function dclose() {
      return `<h2>Day Close</h2><p class=k>Day close summaries</p>`;
    }
    function inv() {
      return `<h2>Inventory</h2><p class=k>Stock tracking system</p>`;
    }
    function act() {
      return `<h2>Activity Log</h2><p class=k>System operational history</p>`;
    }

    function menu() {
      const adm = me.role == 'admin';
      const b = (f, t) => `<button class="btn s" style="display:block;width:100%;text-align:left;margin:6px 0" onclick="closeM();${f}">${t}</button>`;
      modal('<h3>Navigation</h3>' + NAV.filter(n => adm || ['ord', 'cus', 'debt'].includes(n[0])).map(n => b(`go('${n[0]}')`, n[1] + ' ' + n[2])).join('') + b('logout()', '🔒 Log out'));
    }

    function boot() {
      try {
        const s = sessionStorage.getItem('lm_u');
        me = db.users.find(u => u.id == s && u.active !== false) || null;
      } catch (e) {}

      me ? go(me.role == 'admin' ? 'dash' : 'ord') : authScreen();
    }

    start();
  </script>
</body>
</html>
